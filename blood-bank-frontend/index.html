<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' http://127.0.0.1:5000 http://localhost:5000; font-src 'self';">
  <title>Blood Bank &amp; Donor Management System</title>

  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/pages.css">
  <link rel="stylesheet" href="assets/css/print.css" media="print">
</head>
<body>

  <!-- Skip link for keyboard / screen-reader users -->
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <!-- Offline banner -->
  <div id="offline-banner" class="offline-banner" hidden role="alert">
    <span>Cannot reach the server on port 5000</span>
    <button type="button" class="offline-banner__retry" id="offline-retry-btn">Retry</button>
  </div>

  <!-- ========== App layout ========== -->
  <div class="app-layout">

    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar" role="navigation" aria-label="Main navigation">
      <div class="sidebar__header">
        <div class="sidebar__brand">
          <div class="sidebar__logo-container">
            <svg class="sidebar__logo" aria-hidden="true" width="20" height="20">
              <use href="assets/icons/sprite.svg#heart-pulse"></use>
            </svg>
          </div>
          <div class="sidebar__brand-text">
            <span class="sidebar__title">BloodBank</span>
            <span class="sidebar__badge">Clinical Portal</span>
          </div>
        </div>
        <button type="button" class="sidebar__collapse-btn" id="sidebar-collapse-btn"
                aria-label="Collapse sidebar">
          <svg aria-hidden="true" width="18" height="18">
            <use href="assets/icons/sprite.svg#chevron-left"></use>
          </svg>
        </button>
      </div>

      <nav id="main-nav" aria-label="Primary">
        <!-- Filled by JS -->
      </nav>
    </aside>

    <!-- Sidebar overlay (mobile) -->
    <div id="sidebar-overlay" class="sidebar-overlay" hidden></div>

    <!-- Main wrapper -->
    <div class="main-wrapper">

      <!-- Top bar -->
      <header class="topbar" role="banner">
        <div class="topbar__left">
          <button type="button" class="topbar__menu-toggle" id="menu-toggle-btn"
                  aria-label="Open navigation menu">
            <svg aria-hidden="true" width="22" height="22">
              <use href="assets/icons/sprite.svg#menu"></use>
            </svg>
          </button>
          <div id="breadcrumbs" class="breadcrumbs" aria-label="Breadcrumb"></div>
        </div>

        <div class="topbar__right">
          <input type="search" class="topbar__search" id="global-search"
                 placeholder="Search... ( / )" aria-label="Global search">

          <div class="topbar__api-status" id="api-status-pill" aria-live="polite">
            <span class="status-dot"></span>
            <span class="status-label">API</span>
          </div>

          <button type="button" class="topbar__theme-toggle" id="theme-toggle-btn"
                  aria-label="Toggle theme">
            <svg class="icon-sun" aria-hidden="true" width="20" height="20">
              <use href="assets/icons/sprite.svg#sun"></use>
            </svg>
            <svg class="icon-moon" aria-hidden="true" width="20" height="20">
              <use href="assets/icons/sprite.svg#moon"></use>
            </svg>
          </button>

          <div class="topbar__user">
            <span class="topbar__avatar">A</span>
            <span>Admin</span>
          </div>
        </div>
      </header>

      <!-- Main content -->
      <main id="main-content" class="main-content" role="main" tabindex="-1">
        <div id="app"></div>
      </main>

      <!-- Footer -->
      <footer class="footer" role="contentinfo">
        <span>Blood Bank &amp; Donor Management System</span>
        <span id="backend-version"></span>
      </footer>

    </div><!-- /.main-wrapper -->
  </div><!-- /.app-layout -->

  <!-- Toast container -->
  <div id="toast-container" class="toast-container" role="status"
       aria-live="polite" aria-atomic="false"></div>

  <!-- Portals for modals & drawers -->
  <div id="modal-root"></div>
  <div id="drawer-root"></div>

  <!-- No-JS fallback -->
  <noscript>
    <p style="padding:2rem;text-align:center;">
      JavaScript is required to run the Blood Bank &amp; Donor Management System.
      Please enable JavaScript in your browser settings and reload the page.
    </p>
  </noscript>

  <!-- Local vendored Chart.js library -->
  <script src="assets/vendor/chart.umd.min.js"></script>

  <!-- Application entry point -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
